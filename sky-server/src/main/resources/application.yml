server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  data:
    redis:
      port: ${sky.redis.port}
      password: ${sky.redis.password}
      database: ${sky.redis.database}
      timeout: ${sky.redis.timeout}
      host: ${sky.redis.host}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 秘钥不要提交到仓库：优先读环境变量，本地开发可写在 application-dev.yml（已被 .gitignore 忽略）
    # jjwt 0.12.x 要求 HS256 密钥至少 32 个字符
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET_KEY:}
    # 设置jwt过期时间
    admin-ttl: 86400000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${SKY_JWT_USER_SECRET_KEY:}
    user-ttl: 86400000
    user-token-name: authentication
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}

# knife4j 接口文档增强配置（Spring Boot 3 + openapi3）
knife4j:
  enable: false
  setting:
    language: zh_cn
